<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-axpo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#030712" />
      <stop offset="100%" stop-color="#050816" />
    </linearGradient>
    <linearGradient id="grad-axpo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow-axpo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#bg-axpo)" />

  <!-- Ambient Light Bloom -->
  <circle cx="680" cy="70" r="170" fill="#06b6d4" opacity="0.16" filter="url(#glow-axpo)" />
  <circle cx="120" cy="410" r="180" fill="#3b82f6" opacity="0.12" filter="url(#glow-axpo)" />

  <!-- App Window Chrome -->
  <g transform="translate(30, 24)">
    <!-- Window Frame -->
    <rect width="740" height="432" rx="16" fill="#0b1120" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
    
    <!-- Topbar / Header -->
    <path d="M0,16 Q0,0 16,0 L724,0 Q740,0 740,16 L740,44 L0,44 Z" fill="#0f172a" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    
    <!-- Traffic Light Controls -->
    <circle cx="24" cy="22" r="5.5" fill="#ef4444" opacity="0.85" />
    <circle cx="42" cy="22" r="5.5" fill="#f59e0b" opacity="0.85" />
    <circle cx="60" cy="22" r="5.5" fill="#10b981" opacity="0.85" />
    
    <!-- Address URL Bar -->
    <rect x="180" y="10" width="380" height="24" rx="6" fill="#070b14" stroke="rgba(255,255,255,0.08)" />
    <circle cx="196" cy="22" r="3.5" fill="#06b6d4" />
    <text x="212" y="26" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="500">https://axpo-os.vercel.app</text>

    <!-- Sidebar -->
    <rect x="0" y="44" width="140" height="388" fill="#080e1a" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <!-- Sidebar Items -->
    <rect x="14" y="60" width="112" height="26" rx="6" fill="rgba(6,182,212,0.12)" stroke="rgba(6,182,212,0.3)" />
    <circle cx="28" cy="73" r="4" fill="#06b6d4" />
    <rect x="42" y="70" width="60" height="6" rx="3" fill="#38bdf8" />
    
    <rect x="14" y="94" width="112" height="22" rx="6" fill="rgba(255,255,255,0.04)" />
    <circle cx="28" cy="105" r="3.5" fill="#64748b" />
    <rect x="42" y="102" width="50" height="5" rx="2.5" fill="#94a3b8" />

    <rect x="14" y="122" width="112" height="22" rx="6" fill="rgba(255,255,255,0.04)" />
    <circle cx="28" cy="133" r="3.5" fill="#64748b" />
    <rect x="42" y="130" width="55" height="5" rx="2.5" fill="#94a3b8" />

    <rect x="14" y="150" width="112" height="22" rx="6" fill="rgba(255,255,255,0.04)" />
    <circle cx="28" cy="161" r="3.5" fill="#64748b" />
    <rect x="42" y="158" width="45" height="5" rx="2.5" fill="#94a3b8" />

    <!-- Main Cockpit Grid -->
    <g transform="translate(156, 56)">
      <!-- Top Metric Cards -->
      <g>
        <rect width="180" height="74" rx="10" fill="#0e1726" stroke="rgba(255,255,255,0.08)" />
        <text x="14" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">ENTERPRISE TELEMETRY</text>
        <text x="14" y="48" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="700">11 Systems</text>
        <rect x="14" y="56" width="70" height="4" rx="2" fill="#06b6d4" />
      </g>
      <g transform="translate(192, 0)">
        <rect width="180" height="74" rx="10" fill="#0e1726" stroke="rgba(255,255,255,0.08)" />
        <text x="14" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">NEXT.JS 16 &amp; REACT 19</text>
        <text x="14" y="48" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Zero Error Build</text>
        <rect x="14" y="56" width="90" height="4" rx="2" fill="#3b82f6" />
      </g>
      <g transform="translate(384, 0)">
        <rect width="180" height="74" rx="10" fill="#0e1726" stroke="rgba(255,255,255,0.08)" />
        <text x="14" y="24" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">RECRUITER ACCESS</text>
        <text x="14" y="48" fill="#10b981" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Instant Preview</text>
        <rect x="14" y="56" width="80" height="4" rx="2" fill="#10b981" />
      </g>

      <!-- Center Data Visualization Panel -->
      <g transform="translate(0, 86)">
        <rect width="372" height="274" rx="12" fill="#0d1527" stroke="rgba(255,255,255,0.08)" />
        <text x="18" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Cloud Infrastructure &amp; Revenue Telemetry</text>
        <text x="18" y="42" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">TanStack Table v9 · Recharts Real-Time Stream</text>
        
        <!-- Synthetic Chart Line -->
        <path d="M 20 220 C 60 190, 100 240, 140 160 C 180 120, 220 180, 260 110 C 300 70, 330 90, 350 60" fill="none" stroke="url(#grad-axpo)" stroke-width="3" />
        <path d="M 20 220 C 60 190, 100 240, 140 160 C 180 120, 220 180, 260 110 C 300 70, 330 90, 350 60 L 350 240 L 20 240 Z" fill="url(#grad-axpo)" opacity="0.1" />
        
        <circle cx="260" cy="110" r="4" fill="#38bdf8" />
        <circle cx="350" cy="60" r="5" fill="#06b6d4" />
      </g>

      <!-- Right Column: Subsystems list -->
      <g transform="translate(384, 86)">
        <rect width="180" height="274" rx="12" fill="#0d1527" stroke="rgba(255,255,255,0.08)" />
        <text x="14" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Active Modules</text>
        
        <rect x="14" y="42" width="152" height="32" rx="6" fill="#111d33" />
        <text x="24" y="62" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Executive Cockpit</text>
        
        <rect x="14" y="80" width="152" height="32" rx="6" fill="#111d33" />
        <text x="24" y="100" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">CRM &amp; Sales Pipeline</text>

        <rect x="14" y="118" width="152" height="32" rx="6" fill="#111d33" />
        <text x="24" y="138" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Cloud Infrastructure</text>

        <rect x="14" y="156" width="152" height="32" rx="6" fill="#111d33" />
        <text x="24" y="176" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Logistics &amp; Fleet</text>

        <rect x="14" y="194" width="152" height="32" rx="6" fill="#111d33" />
        <text x="24" y="214" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Workspace &amp; Mail</text>

        <rect x="14" y="232" width="152" height="30" rx="6" fill="#06b6d4" opacity="0.15" stroke="rgba(6,182,212,0.4)" />
        <text x="32" y="251" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Instant Preview Mode</text>
      </g>
    </g>
  </g>
</svg>
