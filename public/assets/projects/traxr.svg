<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-traxr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#030712" />
      <stop offset="100%" stop-color="#050816" />
    </linearGradient>
    <linearGradient id="grad-traxr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow-traxr" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="480" fill="url(#bg-traxr)" />

  <!-- Ambient Light Bloom -->
  <circle cx="680" cy="80" r="170" fill="#6366f1" opacity="0.16" filter="url(#glow-traxr)" />
  <circle cx="120" cy="400" r="180" fill="#a855f7" opacity="0.12" filter="url(#glow-traxr)" />

  <!-- App Window Chrome -->
  <g transform="translate(30, 24)">
    <!-- Window Frame -->
    <rect width="740" height="432" rx="16" fill="#0b101e" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
    
    <!-- Topbar / Header -->
    <path d="M0,16 Q0,0 16,0 L724,0 Q740,0 740,16 L740,44 L0,44 Z" fill="#0f1629" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    
    <!-- Traffic Light Controls -->
    <circle cx="24" cy="22" r="5.5" fill="#ef4444" opacity="0.85" />
    <circle cx="42" cy="22" r="5.5" fill="#f59e0b" opacity="0.85" />
    <circle cx="60" cy="22" r="5.5" fill="#10b981" opacity="0.85" />
    
    <!-- Address URL Bar -->
    <rect x="180" y="10" width="380" height="24" rx="6" fill="#070b14" stroke="rgba(255,255,255,0.08)" />
    <circle cx="196" cy="22" r="3.5" fill="#818cf8" />
    <text x="212" y="26" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="500">https://traxr.vercel.app</text>

    <!-- Sidebar -->
    <rect x="0" y="44" width="130" height="388" fill="#080d19" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <!-- Teams & Workspace -->
    <text x="14" y="66" fill="#818cf8" font-family="monospace" font-size="10" font-weight="700">WORKSPACE</text>
    <rect x="14" y="76" width="102" height="24" rx="6" fill="rgba(99,102,241,0.15)" stroke="rgba(99,102,241,0.3)" />
    <text x="24" y="92" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="10" font-weight="600">⚡ Traxr Core</text>
    
    <rect x="14" y="106" width="102" height="20" rx="5" fill="rgba(255,255,255,0.03)" />
    <text x="24" y="120" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Active Cycle</text>

    <rect x="14" y="132" width="102" height="20" rx="5" fill="rgba(255,255,255,0.03)" />
    <text x="24" y="146" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Kanban Board</text>

    <rect x="14" y="158" width="102" height="20" rx="5" fill="rgba(255,255,255,0.03)" />
    <text x="24" y="172" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Backlog</text>

    <!-- Linear-style Command Key Pill -->
    <rect x="14" y="380" width="102" height="24" rx="6" fill="#111827" stroke="rgba(255,255,255,0.1)" />
    <text x="24" y="396" fill="#a5b4fc" font-family="monospace" font-size="9" font-weight="600">⌘K Command</text>

    <!-- Kanban Board Canvas (3 Columns) -->
    <g transform="translate(144, 56)">
      <!-- Column 1: TODO -->
      <g>
        <rect width="180" height="360" rx="10" fill="#0d1424" stroke="rgba(255,255,255,0.06)" />
        <circle cx="16" cy="20" r="4" fill="#94a3b8" />
        <text x="26" y="24" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Todo</text>
        <rect x="150" y="12" width="18" height="16" rx="4" fill="#1e293b" />
        <text x="156" y="24" fill="#94a3b8" font-family="monospace" font-size="9">2</text>
        
        <!-- Card 1 -->
        <g transform="translate(8, 36)">
          <rect width="164" height="68" rx="8" fill="#131c31" stroke="rgba(255,255,255,0.08)" />
          <text x="10" y="20" fill="#818cf8" font-family="monospace" font-size="9" font-weight="600">ENG-104</text>
          <text x="10" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Supabase RLS Rules</text>
          <rect x="10" y="48" width="50" height="12" rx="3" fill="#312e81" />
          <text x="14" y="57" fill="#c7d2fe" font-family="monospace" font-size="8">Security</text>
        </g>
        <!-- Card 2 -->
        <g transform="translate(8, 112)">
          <rect width="164" height="68" rx="8" fill="#131c31" stroke="rgba(255,255,255,0.08)" />
          <text x="10" y="20" fill="#818cf8" font-family="monospace" font-size="9" font-weight="600">ENG-108</text>
          <text x="10" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Tiptap v3 Editor sync</text>
          <rect x="10" y="48" width="54" height="12" rx="3" fill="#1e1b4b" />
          <text x="14" y="57" fill="#a5b4fc" font-family="monospace" font-size="8">Markdown</text>
        </g>
      </g>

      <!-- Column 2: IN PROGRESS -->
      <g transform="translate(192, 0)">
        <rect width="180" height="360" rx="10" fill="#0d1424" stroke="rgba(255,255,255,0.06)" />
        <circle cx="16" cy="20" r="4" fill="#f59e0b" />
        <text x="26" y="24" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="700">In Progress</text>
        <rect x="150" y="12" width="18" height="16" rx="4" fill="#1e293b" />
        <text x="156" y="24" fill="#94a3b8" font-family="monospace" font-size="9">1</text>
        
        <!-- Card Active with Glowing Accent -->
        <g transform="translate(8, 36)">
          <rect width="164" height="84" rx="8" fill="#141e35" stroke="rgba(99,102,241,0.4)" stroke-width="1.5" />
          <text x="10" y="20" fill="#a5b4fc" font-family="monospace" font-size="9" font-weight="600">ENG-112</text>
          <text x="10" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Realtime Multi-Client</text>
          <text x="10" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">postgres_changes hook</text>
          <rect x="10" y="62" width="62" height="14" rx="3" fill="#4338ca" />
          <text x="14" y="72" fill="#e0e7ff" font-family="monospace" font-size="8">Supabase Live</text>
        </g>
      </g>

      <!-- Column 3: DONE -->
      <g transform="translate(384, 0)">
        <rect width="180" height="360" rx="10" fill="#0d1424" stroke="rgba(255,255,255,0.06)" />
        <circle cx="16" cy="20" r="4" fill="#10b981" />
        <text x="26" y="24" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Done (174 Tests)</text>
        <rect x="150" y="12" width="18" height="16" rx="4" fill="#1e293b" />
        <text x="156" y="24" fill="#94a3b8" font-family="monospace" font-size="9">3</text>
        
        <!-- Card 1 -->
        <g transform="translate(8, 36)">
          <rect width="164" height="64" rx="8" fill="#111827" stroke="rgba(255,255,255,0.06)" />
          <text x="10" y="18" fill="#10b981" font-family="monospace" font-size="9" font-weight="600">PGlite Wasm</text>
          <text x="10" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="500">174 Multi-Tenant Tests</text>
          <text x="10" y="52" fill="#10b981" font-family="system-ui, sans-serif" font-size="9">✓ All assertions passed</text>
        </g>
        <!-- Card 2 -->
        <g transform="translate(8, 108)">
          <rect width="164" height="64" rx="8" fill="#111827" stroke="rgba(255,255,255,0.06)" />
          <text x="10" y="18" fill="#10b981" font-family="monospace" font-size="9" font-weight="600">IndexedDB</text>
          <text x="10" y="36" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="500">Offline-first local sync</text>
          <text x="10" y="52" fill="#10b981" font-family="system-ui, sans-serif" font-size="9">✓ Zero latency cold load</text>
        </g>
      </g>
    </g>
  </g>
</svg>
