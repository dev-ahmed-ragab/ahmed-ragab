<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Deep Space Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f24" />
      <stop offset="50%" stop-color="#030712" />
      <stop offset="100%" stop-color="#050816" />
    </linearGradient>

    <!-- Cosmic Border Rim Gradient -->
    <linearGradient id="rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Vibrant Typography Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Subtle Stardust Glow Filter -->
    <filter id="cosmic-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Glow -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bg-grad)" stroke="url(#rim-grad)" stroke-width="4" filter="url(#cosmic-glow)" />

  <!-- Inner Ambient Starlight Accent -->
  <circle cx="106" cy="22" r="3.5" fill="#06b6d4" opacity="0.9" />
  <circle cx="22" cy="106" r="2.5" fill="#8b5cf6" opacity="0.8" />

  <!-- Monogram: Modern Architectural AR -->
  <g font-family="system-ui, -apple-system, 'SF Pro Display', 'Inter', sans-serif" font-weight="900" font-size="56" letter-spacing="-2" text-anchor="middle">
    <text x="64" y="82" fill="url(#text-grad)" font-weight="900">AR</text>
  </g>
</svg>
